{% extends 'base.html' %}

{% block title %}Custom payment{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
        <h1 class="h3 mb-1">Custom payment</h1>
        <p class="text-muted mb-4">Pay securely with Stripe Elements.</p>

        <form id="payment-form" class="card">
            <div class="card-body">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label" for="prices">Product</label>
                    <select class="form-select" id="prices" required>
                        {% for price in prices %}
                        <option value="{{ price.id }}">{{ price.product.name }} - $ {{ price.get_display_price }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email address</label>
                    <input class="form-control" type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="card-element">Card details</label>
                    <div class="form-control py-2" id="card-element"></div>
                    <div class="invalid-feedback d-block" id="card-error" role="alert"></div>
                </div>

                <button class="btn btn-success w-100" id="submit" type="submit">
                    <span class="spinner-border spinner-border-sm d-none" id="spinner" aria-hidden="true"></span>
                    <span id="button-text">Pay</span>
                </button>

                <div class="alert alert-success mt-3 mb-0 d-none result-message">
                    Payment succeeded. View it in your
                    <a href="https://dashboard.stripe.com" target="_blank" rel="noreferrer">Stripe dashboard</a>.
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://js.stripe.com/v3/"></script>
<script>
    var csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    var stripe = Stripe("{{ STRIPE_PUBLIC_KEY }}");
    var submitButton = document.getElementById("submit");

    submitButton.disabled = true;

    var elements = stripe.elements();
    var style = {
        base: {
            color: "#212529",
            fontFamily: 'Arial, sans-serif',
            fontSmoothing: "antialiased",
            fontSize: "16px",
            "::placeholder": {
                color: "#6c757d"
            }
        },
        invalid: {
            color: "#dc3545",
            iconColor: "#dc3545"
        }
    };

    var card = elements.create("card", { style: style });
    card.mount("#card-element");

    card.on("change", function (event) {
        submitButton.disabled = event.empty;
        document.querySelector("#card-error").textContent = event.error ? event.error.message : "";
    });

    var form = document.getElementById("payment-form");
    form.addEventListener("submit", function (event) {
        event.preventDefault();

        var selectedPrice = document.getElementById("prices").value;
        fetch(`/create-payment-intent/${selectedPrice}/`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrftoken
            },
            body: JSON.stringify({
                email: document.getElementById("email").value
            })
        })
            .then(function (result) {
                return result.json();
            })
            .then(function (data) {
                if (data.error) {
                    showError(data.error);
                    return;
                }
                payWithCard(stripe, card, data.clientSecret);
            })
            .catch(function () {
                showError("Unable to start payment. Please try again.");
            });
    });

    var payWithCard = function (stripe, card, clientSecret) {
        loading(true);
        stripe
            .confirmCardPayment(clientSecret, {
                payment_method: {
                    card: card
                }
            })
            .then(function (result) {
                if (result.error) {
                    showError(result.error.message);
                } else {
                    orderComplete(result.paymentIntent.id);
                }
            });
    };

    var orderComplete = function (paymentIntentId) {
        loading(false);
        document
            .querySelector(".result-message a")
            .setAttribute(
                "href",
                "https://dashboard.stripe.com/test/payments/" + paymentIntentId
            );
        document.querySelector(".result-message").classList.remove("d-none");
        submitButton.disabled = true;
    };

    var showError = function (errorMsgText) {
        loading(false);
        var errorMsg = document.querySelector("#card-error");
        errorMsg.textContent = errorMsgText;
        setTimeout(function () {
            errorMsg.textContent = "";
        }, 4000);
    };

    var loading = function (isLoading) {
        if (isLoading) {
            submitButton.disabled = true;
            document.querySelector("#spinner").classList.remove("d-none");
            document.querySelector("#button-text").classList.add("d-none");
        } else {
            submitButton.disabled = false;
            document.querySelector("#spinner").classList.add("d-none");
            document.querySelector("#button-text").classList.remove("d-none");
        }
    };
</script>
{% endblock scripts %}
